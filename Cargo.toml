[package]
name = "skindraw"
version = "0.1.1"
edition = "2024"
authors = ["Will Bradley <williambbradley@gmail.com>"]
description = "A desktop editor for Minecraft-compatible player skins"
repository = "https://github.com/wbbradley/skindraw"
readme = "README.md"

[package.metadata.deb]
maintainer = "Will Bradley <williambbradley@gmail.com>"
copyright = "2026, Will Bradley <williambbradley@gmail.com>"
extended-description = """\
SkinDraw is a focused desktop editor for painting Minecraft-compatible player skins directly on a
three-dimensional model."""
depends = "$auto"
section = "graphics"
priority = "optional"
assets = [
    ["target/release/skindraw", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/skindraw/README.md", "644"],
    ["assets/io.github.wbbradley.SkinDraw.desktop", "usr/share/applications/", "644"],
    ["assets/io.github.wbbradley.SkinDraw.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "wayland",
    "wgpu",
    "x11",
] }
glam = "0.33"
png = "0.18"
pollster = "0.4"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
